<div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const el = document.querySelector('head > script[name="credential"]');
        if (!el) throw new Error('credential data block not found');
        const credential = JSON.parse(el.textContent || 'null');

        const name = credential?.credentialSubject?.name;
        const issuer = credential?.issuer?.name ?? credential?.issuer;

        const nameEl = document.querySelector('#credentialSubject-name');
        const issuerEl = document.querySelector('#issuer-name');
        if (nameEl) nameEl.textContent = name ?? '';
        if (issuerEl) issuerEl.textContent = typeof issuer === 'string' ? issuer : '';

        // Signal host page that rendering is complete
        window.renderMethodReady();
      } catch (err) {
        window.renderMethodReady(err instanceof Error ? err : new Error(String(err)));
      }
    });
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: "DM Sans", system-ui, sans-serif;
    }
    h1 {
      color: #1a4f8a;
      margin: 0 0 0.5rem;
      font-size: 1.6rem;
    }
    p {
      margin: 0;
      color: #334;
    }
  </style>

  <h1 id="credentialSubject-name"></h1>
  <p>Issued by: <span id="issuer-name"></span></p>
</div>
