<div class="card">
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const el = document.querySelector('head > script[name="credential"]');
        if (!el) throw new Error('credential data block not found');
        const credential = JSON.parse(el.textContent || 'null');
        const subject = credential.credentialSubject || {};

        const text = (sel, value) => {
          const node = document.querySelector(sel);
          if (node) node.textContent = value == null || value === '' ? '—' : String(value);
        };

        text('#title', credential.name || subject.name || 'Conformity credential');
        text('#subject-name', subject.name);
        text('#description', subject.description);
        text('#issuer-name', credential.issuer?.name || credential.issuer);
        text('#issued-to', subject.issuedToParty?.name);
        text('#scheme', subject.licensedByScheme?.name || subject.coverage?.[0]?.name);
        text('#assessor-level', subject.assessorLevel);
        text('#assessment-level', subject.assessmentLevel);
        text('#attestation-type', subject.attestationType);
        text('#trustmark', subject.trustmark?.name);

        const assessments = Array.isArray(subject.conformityAssessment)
          ? subject.conformityAssessment
          : [];
        const list = document.querySelector('#assessments');
        for (const item of assessments) {
          const li = document.createElement('li');
          const title = document.createElement('strong');
          title.textContent = item.name || 'Assessment';
          li.appendChild(title);
          if (item.description) {
            const p = document.createElement('p');
            p.textContent = item.description;
            li.appendChild(p);
          }
          const perfs = Array.isArray(item.assessedPerformance)
            ? item.assessedPerformance
            : [];
          for (const perf of perfs) {
            const row = document.createElement('div');
            row.className = 'metric';
            const metric = perf.metric?.name;
            const measure = perf.measure
              ? `${perf.measure.value} ${perf.measure.unit || ''}`.trim()
              : '';
            const det = perf.determination || '';
            row.textContent = [metric, measure, det].filter(Boolean).join(' · ');
            li.appendChild(row);
          }
          list.appendChild(li);
        }
        if (!assessments.length) {
          list.innerHTML = '<li class="muted">No conformity assessments listed.</li>';
        }

        // Public certificate is usually text/html (not a VC). Display only.
        const cert = subject.conformityCertificate;
        const certEl = document.querySelector('#certificate');
        if (cert?.linkURL) {
          const name = document.createElement('div');
          name.textContent = cert.linkName || 'Conformity certificate';
          const url = document.createElement('code');
          url.textContent = cert.linkURL;
          const meta = document.createElement('div');
          meta.className = 'muted';
          meta.textContent = [
            cert.mediaType || 'unknown media type',
            '— not opened via followLink (not credential JSON)',
          ].join(' ');
          certEl.appendChild(name);
          certEl.appendChild(url);
          certEl.appendChild(meta);
        } else {
          certEl.innerHTML = '<span class="muted">No certificate link.</span>';
        }

        const docs = Array.isArray(subject.relatedDocument) ? subject.relatedDocument : [];
        const docsEl = document.querySelector('#documents');
        for (const doc of docs) {
          const li = document.createElement('li');
          if (doc.linkURL && typeof window.renderMethodFollow === 'function') {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'link-btn';
            btn.textContent = doc.linkName || doc.linkURL;
            btn.addEventListener('click', () => {
              window.renderMethodFollow({
                href: doc.linkURL,
                linkType: doc.linkType || 'relatedDocument',
                label: doc.linkName || doc.linkURL,
              });
            });
            li.appendChild(btn);
          } else {
            li.textContent = doc.linkName || doc.linkURL || 'Document';
          }
          docsEl.appendChild(li);
        }
        if (!docs.length) {
          docsEl.innerHTML = '<li class="muted">No related credentials.</li>';
        }

        window.renderMethodReady();
      } catch (err) {
        window.renderMethodReady(err instanceof Error ? err : new Error(String(err)));
      }
    });
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: "DM Sans", system-ui, sans-serif;
      --ink: #142033;
      --muted: #5a6578;
      --line: #d5dde8;
      --accent: #1a4f8a;
      --panel: #fff;
    }
    .card { padding: 0.2rem 0.1rem 0.6rem; color: var(--ink); }
    .eyebrow {
      margin: 0 0 0.3rem; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.25rem; color: var(--accent); line-height: 1.25; }
    .sub { margin: 0 0 0.85rem; color: var(--muted); font-size: 0.92rem; }
    .desc { margin: 0 0 1rem; line-height: 1.45; }
    h2 {
      margin: 1rem 0 0.45rem; font-size: 0.72rem; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--muted);
    }
    dl {
      margin: 0; display: grid; grid-template-columns: 9.5rem 1fr; gap: 0.35rem 0.75rem;
      border: 1px solid var(--line); border-radius: 10px; padding: 0.75rem 0.9rem;
      background: var(--panel);
    }
    dt { color: var(--muted); font-size: 0.78rem; }
    dd { margin: 0; word-break: break-word; }
    ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.55rem; }
    li {
      border: 1px solid var(--line); border-radius: 10px; padding: 0.7rem 0.85rem;
      background: var(--panel);
    }
    li p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.9rem; }
    .metric { margin-top: 0.35rem; font-size: 0.92rem; }
    .muted { color: var(--muted); font-size: 0.82rem; }
    .link-btn {
      font: inherit; font-weight: 600; font-size: 0.9rem; color: #fff;
      background: var(--accent); border: 0; border-radius: 8px;
      padding: 0.45rem 0.75rem; cursor: pointer;
    }
  </style>

  <p class="eyebrow">UNTP Digital Conformity Credential</p>
  <h1 id="title"></h1>
  <p class="sub">
    <span id="subject-name"></span><br />
    Issued by <span id="issuer-name"></span>
  </p>
  <p class="desc" id="description"></p>

  <h2>Attestation</h2>
  <dl>
    <dt>Issued to</dt><dd id="issued-to"></dd>
    <dt>Scheme</dt><dd id="scheme"></dd>
    <dt>Assessor level</dt><dd id="assessor-level"></dd>
    <dt>Assessment level</dt><dd id="assessment-level"></dd>
    <dt>Type</dt><dd id="attestation-type"></dd>
    <dt>Trustmark</dt><dd id="trustmark"></dd>
  </dl>

  <h2>Conformity assessments</h2>
  <ul id="assessments"></ul>

  <h2>Public certificate</h2>
  <div id="certificate"></div>

  <h2>Related credentials</h2>
  <ul id="documents"></ul>
</div>
