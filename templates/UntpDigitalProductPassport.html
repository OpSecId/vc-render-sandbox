<div class="card">
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const el = document.querySelector('head > script[name="credential"]');
        if (!el) throw new Error('credential data block not found');
        const credential = JSON.parse(el.textContent || 'null');
        const subject = credential.credentialSubject || {};

        const text = (sel, value) => {
          const node = document.querySelector(sel);
          if (node) node.textContent = value == null || value === '' ? '—' : String(value);
        };

        text('#passport-name', credential.name || subject.name || 'Digital Product Passport');
        text('#product-name', subject.name);
        text('#product-id', subject.id);
        text('#description', subject.description);
        text('#issuer-name', credential.issuer?.name || credential.issuer);
        text('#model', subject.modelNumber);
        text('#batch', subject.batchNumber);
        text('#produced', subject.productionDate);
        text(
          '#country',
          subject.countryOfProduction?.countryName ||
            subject.countryOfProduction?.countryCode,
        );
        text('#facility', subject.producedAtFacility?.name);
        const weight = subject.dimensions?.weight;
        text(
          '#weight',
          weight ? `${weight.value} ${weight.unit || ''}`.trim() : null,
        );

        const cats = Array.isArray(subject.productCategory)
          ? subject.productCategory
          : [];
        document.querySelector('#categories').textContent = cats
          .map((c) => (c.code ? `${c.code} — ${c.name || ''}` : c.name || ''))
          .filter(Boolean)
          .join('; ') || '—';

        const claims = Array.isArray(subject.performanceClaim)
          ? subject.performanceClaim
          : [];
        const claimsEl = document.querySelector('#claims');
        for (const claim of claims) {
          const li = document.createElement('li');
          const title = document.createElement('strong');
          title.textContent = claim.name || 'Claim';
          li.appendChild(title);
          if (claim.description) {
            const p = document.createElement('p');
            p.textContent = claim.description;
            li.appendChild(p);
          }
          const perf = Array.isArray(claim.claimedPerformance)
            ? claim.claimedPerformance
            : [];
          for (const item of perf) {
            const metric = item.metric?.name || 'Metric';
            const measure = item.measure
              ? `${item.measure.value} ${item.measure.unit || ''}`.trim()
              : '';
            const row = document.createElement('div');
            row.className = 'metric';
            row.textContent = measure ? `${metric}: ${measure}` : metric;
            li.appendChild(row);
          }
          claimsEl.appendChild(li);
        }
        if (!claims.length) {
          claimsEl.innerHTML = '<li class="muted">No performance claims.</li>';
        }

        const provenance = Array.isArray(subject.materialProvenance)
          ? subject.materialProvenance
          : [];
        const provEl = document.querySelector('#provenance');
        for (const mat of provenance) {
          const li = document.createElement('li');
          const frac =
            mat.massFraction != null
              ? ` · ${(Number(mat.massFraction) * 100).toFixed(0)}%`
              : '';
          const origin = mat.originCountry?.countryName || '';
          li.textContent = `${mat.name || 'Material'}${origin ? ` (${origin})` : ''}${frac}`;
          provEl.appendChild(li);
        }
        if (!provenance.length) {
          provEl.innerHTML = '<li class="muted">No material provenance.</li>';
        }

        const docs = Array.isArray(subject.relatedDocument)
          ? subject.relatedDocument
          : [];
        const docsEl = document.querySelector('#documents');
        for (const doc of docs) {
          const li = document.createElement('li');
          const label = doc.linkName || doc.linkURL || 'Related document';
          if (doc.linkURL && typeof window.renderMethodFollow === 'function') {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'link-btn';
            btn.textContent = label;
            btn.addEventListener('click', () => {
              window.renderMethodFollow({
                href: doc.linkURL,
                linkType: doc.linkType || 'relatedDocument',
                label,
              });
            });
            li.appendChild(btn);
            if (doc.mediaType) {
              const meta = document.createElement('div');
              meta.className = 'muted';
              meta.textContent = doc.mediaType;
              li.appendChild(meta);
            }
          } else {
            li.textContent = label;
          }
          docsEl.appendChild(li);
        }
        if (!docs.length) {
          docsEl.innerHTML = '<li class="muted">No related documents.</li>';
        }

        window.renderMethodReady();
      } catch (err) {
        window.renderMethodReady(err instanceof Error ? err : new Error(String(err)));
      }
    });
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: "DM Sans", system-ui, sans-serif;
      --ink: #142033;
      --muted: #5a6578;
      --line: #d5dde8;
      --accent: #0b6e4f;
      --panel: #fff;
    }
    .card { padding: 0.2rem 0.1rem 0.6rem; color: var(--ink); }
    .eyebrow {
      margin: 0 0 0.3rem; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.3rem; line-height: 1.25; }
    .sub { margin: 0 0 0.85rem; color: var(--muted); font-size: 0.92rem; }
    .desc { margin: 0 0 1rem; line-height: 1.45; }
    h2 {
      margin: 1rem 0 0.45rem; font-size: 0.72rem; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--muted);
    }
    dl {
      margin: 0; display: grid; grid-template-columns: 9rem 1fr; gap: 0.35rem 0.75rem;
      border: 1px solid var(--line); border-radius: 10px; padding: 0.75rem 0.9rem;
      background: var(--panel);
    }
    dt { color: var(--muted); font-size: 0.78rem; }
    dd { margin: 0; word-break: break-word; }
    ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.55rem; }
    li {
      border: 1px solid var(--line); border-radius: 10px; padding: 0.7rem 0.85rem;
      background: var(--panel);
    }
    li p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.9rem; }
    .metric { margin-top: 0.35rem; font-size: 0.92rem; }
    .muted { color: var(--muted); font-size: 0.82rem; }
    .link-btn {
      font: inherit; font-weight: 600; font-size: 0.9rem; color: #fff;
      background: var(--accent); border: 0; border-radius: 8px;
      padding: 0.45rem 0.75rem; cursor: pointer;
    }
  </style>

  <p class="eyebrow">UNTP Digital Product Passport</p>
  <h1 id="passport-name"></h1>
  <p class="sub">
    <span id="product-name"></span><br />
    <code id="product-id"></code><br />
    Issued by <span id="issuer-name"></span>
  </p>
  <p class="desc" id="description"></p>

  <h2>Product</h2>
  <dl>
    <dt>Model</dt><dd id="model"></dd>
    <dt>Batch</dt><dd id="batch"></dd>
    <dt>Produced</dt><dd id="produced"></dd>
    <dt>Country</dt><dd id="country"></dd>
    <dt>Facility</dt><dd id="facility"></dd>
    <dt>Weight</dt><dd id="weight"></dd>
    <dt>Category</dt><dd id="categories"></dd>
  </dl>

  <h2>Performance claims</h2>
  <ul id="claims"></ul>

  <h2>Material provenance</h2>
  <ul id="provenance"></ul>

  <h2>Related conformity evidence</h2>
  <ul id="documents"></ul>
</div>
