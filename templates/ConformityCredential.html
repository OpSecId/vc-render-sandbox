<div class="card">
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const el = document.querySelector('head > script[name="credential"]');
        if (!el) throw new Error('credential data block not found');
        const credential = JSON.parse(el.textContent || 'null');
        const subject = credential.credentialSubject || {};
        const attestation = subject.conformityAttestation || subject;

        document.querySelector('#title').textContent =
          attestation.name || subject.name || 'Conformity credential';
        document.querySelector('#issuer-name').textContent =
          credential.issuer?.name || credential.issuer || '';
        document.querySelector('#standard').textContent =
          attestation.standard || attestation.conformityTopic || '—';
        document.querySelector('#result').textContent =
          attestation.conformance || attestation.result || '—';
        document.querySelector('#assessment-body').textContent =
          attestation.assessmentBody || credential.issuer?.name || '—';

        window.renderMethodReady();
      } catch (err) {
        window.renderMethodReady(err instanceof Error ? err : new Error(String(err)));
      }
    });
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: "DM Sans", system-ui, sans-serif;
      --ink: #142033;
      --muted: #5a6578;
      --line: #d5dde8;
      --accent: #1a4f8a;
    }
    .card { padding: 0.25rem 0.15rem 0.5rem; color: var(--ink); }
    .eyebrow {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--muted); margin: 0 0 0.35rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.25rem; color: var(--accent); }
    .meta { margin: 0 0 1rem; color: var(--muted); font-size: 0.9rem; }
    dl {
      margin: 0; display: grid; gap: 0.65rem;
      border: 1px solid var(--line); border-radius: 10px; padding: 0.85rem 1rem;
      background: #fff;
    }
    dt {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--muted);
    }
    dd { margin: 0.15rem 0 0; }
  </style>

  <p class="eyebrow">Digital Conformity Credential</p>
  <h1 id="title"></h1>
  <p class="meta">Issued by <span id="issuer-name"></span></p>
  <dl>
    <div>
      <dt>Standard / topic</dt>
      <dd id="standard"></dd>
    </div>
    <div>
      <dt>Result</dt>
      <dd id="result"></dd>
    </div>
    <div>
      <dt>Assessment body</dt>
      <dd id="assessment-body"></dd>
    </div>
  </dl>
</div>
