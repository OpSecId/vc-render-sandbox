<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Host CSP is installed synchronously by the bootstrap below (per-load nonce).
      - frame-src 'none' forces srcdoc (W3C html suite).
      - script-src uses the page nonce so about:srcdoc scripts can run only when
        the host stamps that nonce onto wrapper + template <script> tags.
      - Wrapper adds its own CSP: default-src data:; script-src 'nonce-…'
    -->
    <script>
      (function () {
        var bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        var bin = "";
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        var nonce = btoa(bin)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/g, "");
        window.__VCR_CSP_NONCE__ = nonce;
        document.write(
          '<meta http-equiv="Content-Security-Policy" content="' +
            "default-src 'self'; " +
            "script-src 'self' 'nonce-" +
            nonce +
            "'; " +
            "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; " +
            "font-src https://fonts.gstatic.com; " +
            "img-src 'self' https: data:; " +
            "connect-src 'self' https: http://localhost:* http://127.0.0.1:*; " +
            "frame-src 'none'; " +
            "base-uri 'self'; " +
            "form-action 'self'" +
            '">'
        );
      })();
    </script>
    <title>VC Render Sandbox</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
